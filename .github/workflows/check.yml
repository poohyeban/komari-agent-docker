name: Check deployment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/komari-monitor/komari-agent:1.2.60@sha256:cb90c04a55afd4a5046d462ef11d5573a79bbb2184316c6d60bb343ed146896e
          - ghcr.io/komari-monitor/komari-agent:1.5.11@sha256:196965643c259f390743705883fc82f9cd1bfa200a1172a75e7d9e1f190c5c18
    env:
      KOMARI_TEST_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check repository contents
        run: |
          git diff --check
          python3 scripts/check_public_files.py
      - name: Install AppArmor parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor
      - name: Isolated container and security smoke test
        run: sudo --preserve-env=KOMARI_TEST_IMAGE python3 tests/container_smoke.py
      - name: Isolated v2 reporting and task test
        run: sudo --preserve-env=KOMARI_TEST_IMAGE python3 tests/runtime_smoke.py
